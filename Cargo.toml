[package]
name = "music_sync"
version = "0.1.0"
edition = "2021"

[profile.release]
debug = 1

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
biquad = "0.5.0"
bytes = "1.10.0"
ciborium = "0.2.2"
colored = "3.0.0"
cpal = "0.15.3"
dashmap = "6.1.0"
gethostname = "1.0.0"
kanal = "0.1.0-pre8"
log = "0.4.25"
plotters = "0.3.7"
pretty_env_logger = "0.5.0"
realfft = "3.4.0"
reqwest = {version = "0.12.12", features = ["json"]}
rodio = "0.20.1"
rustfft = "6.2.0"
serde = "1.0.217"
tokio = {version = "1.43", features = ["signal", "net"]}
toml = "0.8.20"
uuid = {version = "1.13.1", features = ["v4"]}
webrtc-dtls = "0.11.0"
